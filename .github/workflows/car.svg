<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Animated car driving on a road at night</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#3a0808"/>
    </linearGradient>
    <g id="city">
      <rect x="0" y="120" width="40" height="42" fill="#1d0a0a"/>
      <rect x="45" y="100" width="30" height="62" fill="#240c0c"/>
      <rect x="80" y="130" width="45" height="32" fill="#1d0a0a"/>
      <rect x="130" y="90" width="35" height="72" fill="#240c0c"/>
      <rect x="170" y="125" width="40" height="37" fill="#1d0a0a"/>
      <rect x="215" y="110" width="30" height="52" fill="#240c0c"/>
      <rect x="250" y="135" width="50" height="27" fill="#1d0a0a"/>
      <rect x="305" y="95" width="35" height="67" fill="#240c0c"/>
      <rect x="345" y="120" width="40" height="42" fill="#1d0a0a"/>
      <rect x="390" y="105" width="45" height="57" fill="#240c0c"/>
      <rect x="440" y="130" width="35" height="32" fill="#1d0a0a"/>
      <rect x="480" y="85" width="30" height="77" fill="#240c0c"/>
      <rect x="515" y="115" width="45" height="47" fill="#1d0a0a"/>
      <rect x="565" y="128" width="40" height="34" fill="#240c0c"/>
      <rect x="610" y="100" width="35" height="62" fill="#1d0a0a"/>
      <rect x="650" y="122" width="45" height="40" fill="#240c0c"/>
      <rect x="700" y="108" width="30" height="54" fill="#1d0a0a"/>
      <rect x="735" y="132" width="45" height="30" fill="#240c0c"/>
      <rect x="780" y="120" width="20" height="42" fill="#1d0a0a"/>
      <g fill="#ff1e1e" opacity="0.5">
        <rect x="52" y="108" width="4" height="4"/>
        <rect x="60" y="120" width="4" height="4"/>
        <rect x="140" y="100" width="4" height="4"/>
        <rect x="148" y="114" width="4" height="4"/>
        <rect x="320" y="105" width="4" height="4"/>
        <rect x="398" y="116" width="4" height="4"/>
        <rect x="490" y="96" width="4" height="4"/>
        <rect x="498" y="110" width="4" height="4"/>
        <rect x="620" y="110" width="4" height="4"/>
        <rect x="745" y="142" width="4" height="4"/>
      </g>
    </g>
  </defs>
  <style>
    .far { animation: scroll 14s linear infinite; }
    @keyframes scroll { to { transform: translateX(-800px); } }
    .dash { animation: dash 0.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: 55; } }
    .bob { animation: bob 0.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    .spin { animation: spin 0.45s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .star { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .speed { animation: speed 0.6s linear infinite; }
    @keyframes speed { from { transform: translateX(0); opacity: 0.7; } to { transform: translateX(-70px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="800" height="220" fill="url(#sky)"/>

  <g fill="#ffffff">
    <rect class="star" x="60" y="40" width="3" height="3"/>
    <rect class="star" x="150" y="70" width="2" height="2" style="animation-delay:0.4s"/>
    <rect class="star" x="240" y="35" width="3" height="3" style="animation-delay:0.8s"/>
    <rect class="star" x="330" y="60" width="2" height="2" style="animation-delay:1.2s"/>
    <rect class="star" x="420" y="30" width="3" height="3" style="animation-delay:0.6s"/>
    <rect class="star" x="510" y="55" width="2" height="2" style="animation-delay:1s"/>
    <rect class="star" x="590" y="38" width="3" height="3" style="animation-delay:1.5s"/>
    <rect class="star" x="760" y="80" width="2" height="2" style="animation-delay:0.2s"/>
  </g>
  <circle cx="690" cy="62" r="16" fill="#ff1e1e" opacity="0.85"/>

  <g class="far">
    <use href="#city"/>
    <use href="#city" x="800"/>
  </g>

  <rect x="0" y="162" width="800" height="58" fill="#141414"/>
  <line x1="0" y1="163.5" x2="800" y2="163.5" stroke="#ff1e1e" stroke-width="3"/>
  <line class="dash" x1="0" y1="198" x2="800" y2="198" stroke="#ffffff" stroke-width="3" stroke-dasharray="30 25" opacity="0.8"/>

  <g fill="#ffffff">
    <rect class="speed" x="115" y="140" width="26" height="2"/>
    <rect class="speed" x="115" y="152" width="20" height="2" style="animation-delay:0.2s"/>
    <rect class="speed" x="115" y="166" width="26" height="2" style="animation-delay:0.4s"/>
  </g>

  <ellipse cx="195" cy="177" rx="72" ry="4" fill="#000000" opacity="0.5"/>

  <g transform="translate(130 116)">
    <g class="bob">
      <polygon points="128,31 205,17 205,47" fill="#ffe66d" opacity="0.12"/>
      <rect x="0" y="22" width="130" height="26" rx="6" fill="#ff1e1e"/>
      <path d="M28 22 L44 4 L88 4 L106 22 Z" fill="#c40000"/>
      <path d="M36 20 L48 7 L64 7 L64 20 Z" fill="#1b1b2f"/>
      <path d="M70 20 L70 7 L86 7 L98 20 Z" fill="#1b1b2f"/>
      <rect x="8" y="36" width="112" height="3" fill="#0d0d0d"/>
      <rect x="120" y="28" width="8" height="6" fill="#ffe66d"/>
      <rect x="0" y="28" width="5" height="6" fill="#ff8a8a"/>
    </g>
    <g transform="translate(30 48)">
      <circle r="11" fill="#111111" stroke="#bbbbbb" stroke-width="2"/>
      <g class="spin">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#dddddd" stroke-width="2"/>
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#dddddd" stroke-width="2"/>
      </g>
      <circle r="2.5" fill="#dddddd"/>
    </g>
    <g transform="translate(100 48)">
      <circle r="11" fill="#111111" stroke="#bbbbbb" stroke-width="2"/>
      <g class="spin">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#dddddd" stroke-width="2"/>
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#dddddd" stroke-width="2"/>
      </g>
      <circle r="2.5" fill="#dddddd"/>
    </g>
  </g>

  <text x="16" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#ff1e1e">PLAYER 1: HASSAN</text>
  <text x="784" y="26" text-anchor="end" font-family="monospace" font-size="14" font-weight="bold" fill="#ff1e1e">LEVEL 01</text>
</svg>
